<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT Matchmaking — Design Docs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --callout-bg: #f0f7ff;
    --callout-border: #93c5fd;
    --code-bg: #f8fafc;
    --max-width: 860px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.7;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  nav {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin: 1.5rem 0 2rem;
    padding: 0 0 0 0;
  }
  nav button {
    background: none;
    border: none;
    padding: 0.5rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--fg);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
  }
  nav button:hover { color: var(--accent); }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  #content h1 { font-size: 1.8rem; margin: 1.5em 0 0.6em; }
  #content h2 { font-size: 1.35rem; margin: 1.4em 0 0.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
  #content h3 { font-size: 1.1rem; margin: 1.2em 0 0.4em; }
  #content h4 { font-size: 1rem; margin: 1em 0 0.3em; }
  #content p { margin: 0.6em 0; }
  #content ul, #content ol { margin: 0.5em 0; padding-left: 1.5em; }
  #content li { margin: 0.2em 0; }
  #content a { color: var(--accent); }
  #content blockquote {
    border-left: 3px solid var(--border);
    margin: 0.8em 0;
    padding: 0.3em 1em;
    color: #555;
  }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
  #content strong { font-weight: 600; }
  #content img { max-width: 100%; }
  #content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.8em 1em;
    overflow-x: auto;
    font-size: 0.88em;
    line-height: 1.5;
  }
  #content code {
    font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, monospace;
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  #content pre code { background: none; padding: 0; font-size: inherit; }
  #content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  #content th, #content td { border: 1px solid var(--border); padding: 0.4em 0.8em; text-align: left; }
  #content th { background: var(--code-bg); font-weight: 600; }

  #loading { color: #888; font-style: italic; padding: 2rem 0; text-align: center; }
  #error {
    display: none;
    background: #fff0f0;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    margin: 1em 0;
  }

  .callout {
    border-left: 4px solid var(--callout-border);
    background: var(--callout-bg);
    border-radius: 0 6px 6px 0;
    padding: 0.75rem 1rem;
    margin: 1em 0;
  }
  .callout-title {
    font-weight: 600;
    margin-bottom: 0.3em;
    color: #1e40af;
  }
</style>
</head>
<body>
<nav>
  <button data-page="overview" class="active">Overview</button>
  <button data-page="v0.1">v0.1</button>
</nav>
<div id="content">
  <div id="loading">Loading...</div>
</div>
<div id="error"></div>

<script>
marked.use({ gfm: true, breaks: false });

var PAGES = [
  { id: 'overview', file: 'overview.md', node: null },
  { id: 'v0.1',     file: 'v0.1.md',     node: null },
];

function setError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function convertCallouts(html) {
  return html.replace(
    /<blockquote>\s*<p><!\[!(\w+)\]\s*(.*?)<\/p>([\s\S]*?)<\/blockquote>/g,
    function (match, type, title, body) {
      return '<div class="callout callout-' + type.toLowerCase() + '">' +
        '<div class="callout-title">' + title + '</div>' +
        body +
      '</div>';
    }
  );
}

// Extract $$...$$ blocks before marked parsing (marked would split them
// across <p> tags), then restore them into the HTML afterwards.
function renderMarkdown(md) {
  var blocks = [];
  md = md.replace(/\$\$[\s\S]*?\$\$/g, function (m) {
    blocks.push(m);
    return '\n\n<div class="math-block" data-math-idx="' + (blocks.length - 1) + '"></div>\n\n';
  });

  var html = marked.parse(md);
  html = convertCallouts(html);
  html = html.replace(/<div class="math-block" data-math-idx="(\d+)"><\/div>/g,
    function (match, idx) { return blocks[parseInt(idx, 10)]; }
  );
  return html;
}

function renderPage(md) {
  var div = document.createElement('div');
  div.className = 'page';
  div.innerHTML = renderMarkdown(md);
  renderMathInElement(div, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false },
    ],
    throwOnError: false,
  });
  return div;
}

function showPage(id) {
  PAGES.forEach(function (page) {
    if (page.node) page.node.style.display = (page.id === id) ? '' : 'none';
  });
  document.querySelectorAll('nav button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.page === id);
  });
}

async function boot() {
  var content = document.getElementById('content');
  try {
    for (var i = 0; i < PAGES.length; i++) {
      var page = PAGES[i];
      var resp = await fetch(page.file);
      if (!resp.ok) throw new Error('Failed to load ' + page.file + ': ' + resp.status);
      var md = await resp.text();
      page.node = renderPage(md);
      page.node.style.display = 'none';
      content.appendChild(page.node);
    }
    document.getElementById('loading').remove();
    showPage('overview');
  } catch (e) {
    setError(e.message);
    var loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  }
}

document.querySelectorAll('nav button').forEach(function (b) {
  b.addEventListener('click', function () { showPage(b.dataset.page); });
});

boot();
</script>
</body>
</html>
