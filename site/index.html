<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RT Matchmaking — Design Docs</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-all-in-one.ts@0.7.0/dist/esm/index.js" id="typst"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --callout-bg: #f0f7ff;
    --callout-border: #93c5fd;
    --code-bg: #f8fafc;
    --max-width: 860px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.7;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  nav {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 1rem 0;
    display: flex;
    gap: 0;
    z-index: 10;
  }
  nav button {
    background: none;
    border: none;
    padding: 0.5rem 1rem;
    font-size: 0.95rem;
    cursor: pointer;
    color: #64748b;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  nav button:hover { color: var(--fg); }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  #content {
    padding-top: 1.5rem;
  }
  #loading {
    text-align: center;
    padding: 3rem;
    color: #94a3b8;
  }
  #error {
    display: none;
    color: #dc2626;
    padding: 1rem;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 6px;
    margin-top: 1rem;
  }

  h1, h2, h3, h4, h5, h6 {
    margin-top: 1.8em;
    margin-bottom: 0.6em;
    line-height: 1.3;
  }
  h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
  h3 { font-size: 1.15rem; }
  p { margin-bottom: 0.9em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 1.5rem; margin-bottom: 0.9em; }
  li { margin-bottom: 0.25em; }
  blockquote {
    border-left: 3px solid #d1d5db;
    padding: 0.5rem 1rem;
    margin: 1em 0;
    color: #6b7280;
  }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 3px;
    font-size: 0.9em;
    font-family: "SF Mono", "Fira Code", monospace;
  }
  pre {
    background: var(--code-bg);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
    margin: 1em 0;
    border: 1px solid var(--border);
  }
  pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.6;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
    font-size: 0.95em;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  th { background: var(--code-bg); font-weight: 600; }

  .math-display {
    display: block;
    text-align: center;
    margin: 1.2em 0;
    overflow-x: auto;
  }
  .math-display svg { max-width: 100%; height: auto; }
  .math-inline { display: inline; }
  .math-inline svg {
    display: inline;
    height: 1.1em;
    vertical-align: -0.20em;
  }

  .callout {
    border-left: 4px solid var(--callout-border);
    background: var(--callout-bg);
    border-radius: 0 6px 6px 0;
    padding: 0.75rem 1rem;
    margin: 1em 0;
  }
  .callout-title {
    font-weight: 600;
    margin-bottom: 0.3em;
    color: #1e40af;
  }
</style>
</head>
<body>
<nav>
  <button data-file="overview.md" class="active">Overview</button>
  <button data-file="v0.1.md">v0.1</button>
</nav>
<div id="content">
  <div id="loading">Loading Typst renderer&hellip;</div>
</div>
<div id="error"></div>

<script>
let typstReady = false;
let renderQueue = [];

function setError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function preprocessMath(markdown) {
  const placeholders = [];
  const lines = markdown.split('\n');
  const result = [];
  let inCodeBlock = false;
  let inDisplayMath = false;
  let displayMathLines = [];
  let pid = 0;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Fenced code blocks — pass through unmodified
    if (trimmed.startsWith('```')) {
      inCodeBlock = !inCodeBlock;
      if (inDisplayMath) {
        // Unterminated display math inside code block: flush as literal
        result.push('$');
        result.push(...displayMathLines);
        displayMathLines = [];
        inDisplayMath = false;
      }
      result.push(line);
      continue;
    }
    if (inCodeBlock) {
      if (inDisplayMath) {
        result.push('$');
        result.push(...displayMathLines);
        displayMathLines = [];
        inDisplayMath = false;
      }
      result.push(line);
      continue;
    }

    // Multi-line display math delimiter
    if (trimmed === '$') {
      if (inDisplayMath) {
        const expr = displayMathLines.join('\n').trim();
        const ph = `__MD${pid}__`;
        placeholders.push({ ph, expr, display: true });
        result.push(ph);
        displayMathLines = [];
        inDisplayMath = false;
        pid++;
      } else {
        inDisplayMath = true;
      }
      continue;
    }

    if (inDisplayMath) {
      displayMathLines.push(line);
      continue;
    }

    // Single-line display math: only $...$ on the line
    const singleLineMatch = trimmed.match(/^\$(.+)\$$/);
    if (singleLineMatch && !trimmed.match(/^\$\$.+\$\$$/)) {
      const expr = singleLineMatch[1].trim();
      const ph = `__MD${pid}__`;
      placeholders.push({ ph, expr, display: true });
      result.push(ph);
      pid++;
      continue;
    }

    // Inline math within text
    let processed = line;
    const inlineRegex = /(?<!\$)\$(?!\$)([^$]+)\$(?!\$)/g;
    processed = processed.replace(inlineRegex, (match, expr) => {
      const ph = `__MI${pid}__`;
      placeholders.push({ ph, expr, display: false });
      pid++;
      return ph;
    });
    result.push(processed);
  }

  // Handle unterminated display math at EOF
  if (inDisplayMath) {
    result.push('$');
    result.push(...displayMathLines);
  }

  return { text: result.join('\n'), placeholders };
}

function convertCallouts(html) {
  // Convert [!info] blockquotes to styled callout divs
  // Matches: <blockquote>\n<p>[!info] Title</p>\n...
  return html.replace(
    /<blockquote>\s*<p><!\[!(\w+)\]\s*(.*?)<\/p>([\s\S]*?)<\/blockquote>/g,
    (match, type, title, body) => {
      return `<div class="callout callout-${type.toLowerCase()}">
        <div class="callout-title">${title}</div>
        ${body}
      </div>`;
    }
  );
}

async function renderMath(expr, display) {
  const typstSrc = `#set page(width: auto, height: auto, margin: 0pt)\n$ ${expr} $`;
  try {
    const svg = await $typst.svg({ mainContent: typstSrc });

    // Typst wraps SVG in a span; extract just the <svg> element(s)
    const wrapper = document.createElement('span');
    wrapper.innerHTML = svg;
    const svgEls = wrapper.querySelectorAll('svg');
    if (svgEls.length === 0) {
      // Fallback: use the raw output if no SVG found
      const cls = display ? 'math-display' : 'math-inline';
      return `<span class="${cls}">${svg}</span>`;
    }

    // Collect all SVGs
    let svgHTML = '';
    svgEls.forEach(el => {
      el.removeAttribute('width');
      el.removeAttribute('height');
      el.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svgHTML += el.outerHTML;
    });

    const cls = display ? 'math-display' : 'math-inline';
    return `<span class="${cls}">${svgHTML}</span>`;
  } catch (e) {
    return `<code class="math-fallback">${escapeHtml(expr)}</code>`;
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function renderDocument(filename) {
  const content = document.getElementById('content');
  const loading = document.getElementById('loading');

  if (!typstReady) {
    loading.style.display = 'block';
    renderQueue = [filename];
    return;
  }

  loading.style.display = 'block';
  try {
    const resp = await fetch(filename);
    if (!resp.ok) throw new Error(`Failed to load ${filename}: ${resp.status}`);
    let md = await resp.text();

    // Preprocess: extract math → placeholders
    const { text: cleanMd, placeholders } = preprocessMath(md);

    // Configure marked
    marked.setOptions({ breaks: false, gfm: true });

    // Parse markdown
    let html = marked.parse(cleanMd);

    // Convert callouts
    html = convertCallouts(html);

    // Render math placeholders
    for (const { ph, expr, display } of placeholders) {
      const rendered = await renderMath(expr, display);
      html = html.replace(ph, rendered);
    }

    content.innerHTML = html;
  } catch (e) {
    setError(e.message);
    content.innerHTML = '';
  } finally {
    loading.style.display = 'none';
  }
}

function switchTab(button, filename) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  renderDocument(filename);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  // Listen for typst.ts ready
  const typstScript = document.getElementById('typst');
  if (typstScript) {
    typstScript.addEventListener('load', () => {
      typstReady = true;
      // Render queued or default document
      const file = renderQueue.length > 0 ? renderQueue.shift() : 'overview.md';
      renderDocument(file);
    });
    // Fallback: if load already fired before DOMContentLoaded
    if (typstScript.loaded) {
      typstReady = true;
    }
  }

  // Tab navigation
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn, btn.dataset.file));
  });

  // Start with default
  setTimeout(() => {
    if (typstReady) {
      renderDocument('overview.md');
    } else {
      // If nach 5s Typst hasn't loaded, render without math
      setTimeout(() => {
        if (!typstReady) {
          document.getElementById('loading').textContent = 'Typst still loading... (may take a moment for WASM)';
        }
      }, 5000);
    }
  }, 100);
});
</script>
</body>
</html>
